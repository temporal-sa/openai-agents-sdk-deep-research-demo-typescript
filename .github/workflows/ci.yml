name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build from a clean tree
        run: npm run build

      - name: Verify required build outputs
        run: |
          test -f dist/src/app.js
          test -f dist/src/worker.js
          test -f dist/src/server/main.js
          test -f ui/dist/js/api-client.js
          test -f ui/dist/js/index.js
          test -f ui/dist/js/success.js

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag openai-deep-research-ts:ci .
